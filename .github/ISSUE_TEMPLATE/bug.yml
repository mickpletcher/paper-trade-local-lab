name: Bug report
description: Report a reproducible defect in TradeForge.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials or private market data. Report security issues through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit SHA, release, or container tag.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and installation method.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs or tracebacks when useful.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, account identifiers, and private market data.
          required: true
        - label: This is not a private security vulnerability.
          required: true
