name: Feature request
description: Propose an improvement within TradeForge's local research scope.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Research problem
      description: What workflow or limitation should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the operator-visible result, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal keeps order execution simulated and local.
          required: true
