name: Compatibility Canary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  major-upgrade-canary:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Bootstrap validation dependencies
        run: python scripts/bootstrap.py

      - name: Validate runtime compatibility
        run: |
          python -m pytest -q
          docker build -t tradeforge-compatibility-canary .
