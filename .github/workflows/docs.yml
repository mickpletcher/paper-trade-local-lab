name: Docs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Markdown tooling
        run: npm ci --ignore-scripts

      - name: Run Markdown lint
        shell: pwsh
        run: ./scripts/Test-Markdown.ps1

  links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify docs section entry points
        run: |
          test -f docs/README.md
          test -f docs/architecture/README.md
          test -f docs/installation/README.md
          test -f docs/configuration/README.md
          test -f docs/strategies/README.md
          test -f docs/backtesting/README.md
          test -f docs/ai-integration/README.md
          test -f docs/market-data/README.md
          test -f docs/database/README.md
          test -f docs/plugins/README.md
          test -f docs/security/README.md
          test -f docs/automation/README.md
          test -f docs/api/README.md
          test -f docs/roadmap/README.md
          test -f docs/contributing/README.md
          test -f docs/faq/README.md
