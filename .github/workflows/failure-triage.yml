name: Repeated Failure Triage

on:
  workflow_run:
    workflows: [CI, Governance]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  issue:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest

    steps:
      - name: Create or update a deduplicated issue after consecutive failures
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          consecutive="$(gh run list --repo "$REPOSITORY" --workflow "$WORKFLOW_NAME" --limit 2 --json conclusion --jq '[.[].conclusion] == ["failure", "failure"]')"
          if [ "$consecutive" != "true" ]; then
            exit 0
          fi
          title="Repeated automation failure: $WORKFLOW_NAME"
          issue="$(gh issue list --repo "$REPOSITORY" --state open --search "in:title $title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPOSITORY" --body "Another consecutive failure occurred: $RUN_URL"
          else
            gh issue create --repo "$REPOSITORY" --title "$title" --body "Two consecutive failures were detected. Latest run: $RUN_URL"
          fi
