name: Repository Policy

on:
  schedule:
    - cron: "11 9 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: read

jobs:
  drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository policy
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_POLICY_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "REPOSITORY_POLICY_TOKEN repository secret is required."
          }
          ./scripts/Test-RepositoryPolicy.ps1
