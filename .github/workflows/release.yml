name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --constraint requirements.lock -e ".[dev]"

      - name: Validate tag and package version
        shell: bash
        run: |
          package_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate release
        run: |
          ruff check .
          ruff format --check .
          python -m pytest -q
          python scripts/Test-MigrationPerformance.py --rows 25000 --max-seconds 20
          python scripts/Test-BacktestPerformance.py --rows 100000 --max-seconds 5
          python -m build

      - name: Generate CycloneDX SBOM
        run: cyclonedx-py environment --output-format JSON --output-file dist/tradeforge-sbom.cdx.json

      - name: Attest release packages
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*

      - name: Attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: dist/*.whl
          sbom-path: dist/tradeforge-sbom.cdx.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag --title "TradeForge $GITHUB_REF_NAME"
