[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeforge"
version = "0.1.0"
description = "Local-first paper trading and strategy testing platform."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mick Pletcher" }]
keywords = ["backtesting", "paper-trading", "quantitative-finance", "trading-simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.111",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx2>=2.0",
  "mypy>=1.15",
  "pandas-stubs>=2.2",
  "pip-audit>=2.10,<3",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.11.0",
]

[project.scripts]
tradeforge = "tradeforge.cli:app"

[project.urls]
Changelog = "https://github.com/mickpletcher/paper-trade-local-lab/blob/main/CHANGELOG.md"
Documentation = "https://github.com/mickpletcher/paper-trade-local-lab/tree/main/docs"
Issues = "https://github.com/mickpletcher/paper-trade-local-lab/issues"
Repository = "https://github.com/mickpletcher/paper-trade-local-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradeforge = ["alembic/env.py", "alembic/script.py.mako", "alembic/versions/*.py", "sample_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/tradeforge/cli.py" = ["B008"]

[tool.mypy]
files = ["src/tradeforge"]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["tradeforge"]

[tool.coverage.report]
fail_under = 88
show_missing = true
