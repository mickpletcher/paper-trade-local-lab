[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeforge"
version = "0.1.0"
description = "Local-first paper trading and strategy testing platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.111",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["build>=1.2", "httpx>=0.27", "pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.11.0"]

[project.scripts]
tradeforge = "tradeforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradeforge = ["alembic/env.py", "alembic/script.py.mako", "alembic/versions/*.py", "sample_data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
